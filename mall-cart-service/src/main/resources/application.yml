server:
  port: 8103

spring:
  application:
    name: mall-cart
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: localhost:8848
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

mall:
  jwt:
    secret: mall-dev-secret-key-please-change-in-prod-0123456789abcdef
    expire-hours: 72
  feign:
    product: mall-product
