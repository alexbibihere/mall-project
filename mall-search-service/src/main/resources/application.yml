server:
  port: 8106

spring:
  application:
    name: mall-search
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: localhost:8848

elasticsearch:
  host: localhost
  port: 9200

rocketmq:
  name-server: localhost:9876
  producer:
    group: mall-product-producer-group
    send-message-timeout: 3000

search:
  fulltext-fields: name,category,brand

mall:
  jwt:
    secret: mall-dev-secret-key-please-change-in-prod-0123456789abcdef
    expire-hours: 72
