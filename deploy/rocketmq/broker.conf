brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 容器内监听全部网卡；对宿主机(Windows)通告宿主可达地址
brokerIP1 = 127.0.0.1
listenPort = 10911

# 应用(Spring Boot, Windows 宿主) 经宿主端口访问 namesrv
namesrvAddr = host.docker.internal:9876

autoCreateTopicEnable = true
